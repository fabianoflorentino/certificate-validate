{{ define "main" }}
<article class="home">
    <section class="hero">
        <h1>{{ .Site.Params.tagline }}</h1>
        <p class="subtitle">{{ .Site.Params.subtitle }}</p>
        <div class="hero-actions">
            <a href="{{ .Site.Params.github }}" class="btn btn-primary">GitHub</a>
            <a href="{{ .Site.Params.pkg_go }}" class="btn btn-secondary">Go Docs</a>
            <a href="{{ .Site.Params.docker }}" class="btn btn-secondary">Docker Hub</a>
        </div>
    </section>

    <section class="content">
        {{ .Content }}
    </section>
</article>
{{ end }}
