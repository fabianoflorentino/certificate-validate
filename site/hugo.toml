baseURL = "https://fabianoflorentino.github.io/certificate-validate/"
languageCode = "en-us"
title = "certificate-validate"

[params]
  description = "A modern SSL/TLS certificate validation tool with CLI, HTTP API, and web dashboard"
  github = "https://github.com/fabianoflorentino/certificate-validate"
  docker  = "https://hub.docker.com/r/fabianoflorentino/certificate-validate"
  pkg_go = "https://pkg.go.dev/github.com/fabianoflorentino/certificate-validate"
  swagger = "https://fabianoflorentino.github.io/certificate-validate/swagger/"
  version = "v1.0.4"
  tagline = "SSL/TLS certificate validation. CLI, API, dashboard, and Kubernetes."
  subtitle = "A modern Go tool for monitoring certificates with real-time checks, revocation validation (OCSP/CRL), Prometheus metrics, webhook alerts, Kubernetes monitoring (k8s monitor), and an interactive web dashboard."
  author  = "Fabiano Florentino"
  license = "Apache License 2.0"
  license_url = "https://www.apache.org/licenses/LICENSE-2.0"

