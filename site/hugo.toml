baseURL = "https://fabianoflorentino.github.io/certificate-validate/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "certificate-validate"

[params]
  github = "https://github.com/fabianoflorentino/certificate-validate"
  docker  = "https://hub.docker.com/r/fabianoflorentino/certificate-validate"
  pkg_go = "https://pkg.go.dev/github.com/fabianoflorentino/certificate-validate"
  swagger = "https://fabianoflorentino.github.io/certificate-validate/swagger/"
  version = "v1.0.17"
  author  = "Fabiano Florentino"
  license = "Apache License 2.0"
  license_url = "https://www.apache.org/licenses/LICENSE-2.0"

[languages]
  [languages.en]
    languageCode = "en-us"
    languageName = "EN"
    weight = 1
    title = "certificate-validate"
    [languages.en.params]
      description = "Monitor SSL/TLS certificates from the CLI, HTTP API, or Kubernetes with OCSP/CRL checks, Prometheus metrics, and webhook alerts."
      tagline = "Certificates expire."
      headline_accent = "Your uptime shouldn't."
      subtitle = "Validate TLS from the CLI or HTTP API, monitor Kubernetes Secrets and Ingresses, verify OCSP/CRL revocation, and ship Prometheus metrics and webhook alerts before expiry becomes an outage."
    [languages.en.menu]
      [[languages.en.menu.main]]
        name   = "Quickstart"
        url    = "/#quickstart"
        weight = 1
      [[languages.en.menu.main]]
        name   = "Why"
        url    = "/#problems"
        weight = 2
      [[languages.en.menu.main]]
        name   = "Features"
        url    = "/#features"
        weight = 3
      [[languages.en.menu.main]]
        name   = "Demo"
        url    = "/#demo"
        weight = 4
      [[languages.en.menu.main]]
        name   = "Docs"
        url    = "https://pkg.go.dev/github.com/fabianoflorentino/certificate-validate"
        weight = 5

  [languages.pt-br]
    languageCode = "pt-BR"
    languageName = "PT-BR"
    weight = 2
    title = "certificate-validate"
    [languages.pt-br.params]
      description = "Monitore certificados SSL/TLS pela CLI, API HTTP ou Kubernetes com verificações OCSP/CRL, métricas Prometheus e alertas via webhook."
      tagline = "Certificados expiram."
      headline_accent = "Seu uptime não deveria."
      subtitle = "Valide TLS pela CLI ou API HTTP, monitore Secrets e Ingresses do Kubernetes, verifique revogação via OCSP/CRL e envie métricas Prometheus e alertas por webhook antes que a expiração vire uma indisponibilidade."
    [languages.pt-br.menu]
      [[languages.pt-br.menu.main]]
        name   = "Início rápido"
        url    = "/#quickstart"
        weight = 1
      [[languages.pt-br.menu.main]]
        name   = "Por quê"
        url    = "/#problems"
        weight = 2
      [[languages.pt-br.menu.main]]
        name   = "Recursos"
        url    = "/#features"
        weight = 3
      [[languages.pt-br.menu.main]]
        name   = "Demonstração"
        url    = "/#demo"
        weight = 4
      [[languages.pt-br.menu.main]]
        name   = "Documentação"
        url    = "https://pkg.go.dev/github.com/fabianoflorentino/certificate-validate"
        weight = 5

