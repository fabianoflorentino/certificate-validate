baseURL = "https://fabianoflorentino.github.io/certificate-validate/"
languageCode = "en-us"
title = "certificate-validate"

[params]
  description = "Monitor SSL/TLS certificates from the CLI, HTTP API, or Kubernetes with OCSP/CRL checks, Prometheus metrics, and webhook alerts."
  github = "https://github.com/fabianoflorentino/certificate-validate"
  docker  = "https://hub.docker.com/r/fabianoflorentino/certificate-validate"
  pkg_go = "https://pkg.go.dev/github.com/fabianoflorentino/certificate-validate"
  swagger = "https://fabianoflorentino.github.io/certificate-validate/swagger/"
  version = "v1.0.4"
  eyebrow = "Open source · Go · Kubernetes · Prometheus"
  tagline = "Certificates expire."
  headline_accent = "Your uptime shouldn't."
  subtitle = "Validate TLS from the CLI or HTTP API, monitor Kubernetes Secrets and Ingresses, verify OCSP/CRL revocation, and ship Prometheus metrics and webhook alerts before expiry becomes an outage."
  author  = "Fabiano Florentino"
  license = "Apache License 2.0"
  license_url = "https://www.apache.org/licenses/LICENSE-2.0"

