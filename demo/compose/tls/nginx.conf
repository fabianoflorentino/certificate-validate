server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    location / {
        default_type text/plain;
        return 200 "certificate-validate demo TLS origin\n";
    }
}
