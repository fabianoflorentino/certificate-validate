---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-validate-monitor
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: certificate-validate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: certificate-validate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: certificate-validate
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
    spec:
      serviceAccountName: cert-validate-monitor
      containers:
        - name: monitor
          image: docker.io/fabianoflorentino/certificate-validate:latest
          imagePullPolicy: IfNotPresent
          args:
            - k8s
            - monitor
            - --watch-interval=300
            - --check-revocation
            - --webhook-url=$(ALERT_WEBHOOK_URL)
            - --webhook-threshold=15
            - --metrics-addr=:9102
          env:
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: cert-validate-monitor-webhook
                  key: url
                  optional: true
          ports:
            - containerPort: 9102
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
