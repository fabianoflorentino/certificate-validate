---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-validate-monitor
  namespace: cert-manager
---
# Phase 2: read-only monitoring plus auto-renewal. `update` on secrets
# enables the cert-manager force-renew annotation, `events` records renewal
# progress, and cert-manager CRDs are readable for post-renewal validation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-validate-monitor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-validate-monitor
subjects:
  - kind: ServiceAccount
    name: cert-validate-monitor
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-validate-monitor
  apiGroup: rbac.authorization.k8s.io
