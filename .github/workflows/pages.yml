name: Site Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (build site without deploying)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve site version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "${VERSION}" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -z "${VERSION}" ]; then
            VERSION="$(grep -E '^  version = ' site/hugo.toml | head -1 | sed -E 's/.*"(.*)"/\1/')"
          fi
          echo "HUGO_SITE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Site version: ${VERSION}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
