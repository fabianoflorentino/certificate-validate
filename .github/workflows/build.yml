name: Build

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry-run (skip publishing actions)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  binary:
    name: Build binary artifact
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-s -w" \
            -o certificate-validate \
            ./cmd/certificate-validate

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: certificate-validate-linux-amd64
          path: certificate-validate
