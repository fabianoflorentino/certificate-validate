name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (skip publishing actions)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
      - 'Makefile'
      - '.agents/**'
      - '.*/**'

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.compute.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next patch version
        id: compute
        run: |
          LATEST=$(git tag --list 'v1.0.*' | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.1"
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="v1.0.$((PATCH + 1))"
          fi
          echo "Latest tag: ${LATEST:-<none>}  →  Next version: $NEXT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Lint with go vet
        run: go vet ./...

  test:
    name: Test & Coverage
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out -covermode=atomic \
            ./...

      - name: Check coverage ≥ 80%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out \
            | grep '^total:' \
            | awk '{print $3}' \
            | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 80)}"; then
            echo "FAIL: coverage ${COVERAGE}% is below the required 80%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% meets the 80% threshold"

      - name: Build check
        run: go build ./...

  build:
    name: Build binary
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-s -w" \
            -o certificate-validate \
            ./cmd/certificate-validate

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: certificate-validate-linux-amd64
          path: certificate-validate

  docker:
    name: Build and Push Docker image
    environment: DOCKERHUB
    needs: [version, build]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_REF="${{ github.repository }}:${{ needs.version.outputs.next_version }}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          docker build --no-cache --rm \
            -t "${IMAGE_REF}" \
            -f ./Dockerfile .

      - name: Tag Docker image as latest
        run: |
          docker tag "${IMAGE_REF}" "${{ github.repository }}:latest"

      - name: Push Docker image to Docker Hub
        run: |
          docker push "${IMAGE_REF}"
          docker push "${{ github.repository }}:latest"

  tag:
    name: Tag
    needs: [version, build]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG_NAME="${{ needs.version.outputs.next_version }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [version, build, tag]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.next_version }}
          name: ${{ needs.version.outputs.next_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: certificate-validate-linux-amd64
          path: .

      - name: Upload binary asset to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./certificate-validate
          asset_name: certificate-validate-linux-amd64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go_proxy:
    name: pkg.go.dev
    needs: [version, tag, release]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update pkg.go.dev
        run: GOPROXY=https://proxy.golang.org go list -m github.com/fabianoflorentino/certificate-validate@${{ needs.version.outputs.next_version }}
